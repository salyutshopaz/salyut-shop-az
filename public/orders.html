
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>Sifarişlərim | SALYUT SHOP AZ</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090909;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{height:75px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:#101010;border-bottom:1px solid #252525}
.logo{font-size:21px;font-weight:900;color:#ff8c00}
.back{color:#fff;text-decoration:none;border:1px solid #333;padding:11px 16px;border-radius:9px;font-size:13px}
.container{max-width:950px;margin:50px auto;padding:0 18px}
.heading{text-align:center;margin-bottom:35px}
.heading-icon{width:65px;height:65px;margin:0 auto 17px;background:#2b1908;color:#ff9500;border-radius:20px;display:grid;place-items:center;font-size:30px}
.heading h1{font-size:30px;margin-bottom:10px}
.heading p{color:#999;font-size:14px}
.panel{background:#121212;border:1px solid #292929;border-radius:17px;padding:24px}
.panel-title{font-size:17px;margin-bottom:20px}
.order{background:#191919;border:1px solid #303030;border-radius:13px;padding:20px;margin-bottom:15px}
.order-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}
.order-id{font-size:13px;color:#999;margin-bottom:7px}
.order-date{font-size:12px;color:#777}
.status{padding:8px 12px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.pending{background:#382b12;color:#ffc45d}
.processing{background:#172c42;color:#83c7ff}
.shipped{background:#252044;color:#c3a7ff}
.completed{background:#12351f;color:#7ce6a0}
.cancelled{background:#381919;color:#ff9292}
.items{border-top:1px solid #303030;border-bottom:1px solid #303030;padding:15px 0;margin:12px 0}
.item{display:flex;justify-content:space-between;gap:12px;margin:8px 0;font-size:13px}
.item span{color:#bbb}
.item strong{white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:15px}
.total span{color:#999;font-size:13px}
.total strong{color:#ff9d18;font-size:21px}
.empty,.loading,.error{text-align:center;padding:35px 15px;color:#999;font-size:14px;line-height:1.8}
.empty-icon{font-size:36px;margin-bottom:12px}
.actions{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.action{display:inline-block;padding:13px 18px;border-radius:9px;text-decoration:none;font-size:13px;font-weight:800}
.primary{background:#ff9000;color:#111}
.secondary{border:1px solid #444;color:#fff}
@media(max-width:550px){
header{padding:0 15px;height:65px}
.logo{font-size:16px}
.container{margin:35px auto}
.heading h1{font-size:25px}
.panel{padding:15px}
.order{padding:15px}
.order-top{align-items:flex-start}
.status{font-size:10px;padding:7px 9px}
}
</style>
</head>

<body>

<header>
    <div class="logo">SALYUT SHOP AZ</div>
    <a href="/profile.html" class="back">← Profilim</a>
</header>

<main class="container">

    <div class="heading">
        <div class="heading-icon">▤</div>
        <h1>Sifarişlərim</h1>
        <p>Verdiyiniz bütün sifarişləri buradan izləyə bilərsiniz.</p>
    </div>

    <section class="panel">
        <h2 class="panel-title">Sifariş tarixçəsi</h2>
        <div id="ordersList" class="loading">Sifarişlər yüklənir...</div>
    </section>

    <div class="actions">
        <a href="/#products" class="action primary">Məhsullara bax</a>
        <a href="/profile.html" class="action secondary">Profilim</a>
    </div>

</main>

<script>
const ordersList = document.getElementById("ordersList");

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);
}

function getStatus(status) {
    const statuses = {
        pending: ["Yeni sifariş", "pending"],
        processing: ["Hazırlanır", "processing"],
        shipped: ["Yola göndərildi", "shipped"],
        completed: ["Çatdırıldı", "completed"],
        cancelled: ["Ləğv edildi", "cancelled"]
    };

    return statuses[status] || [status || "Naməlum", "pending"];
}

function formatDate(value) {
    if (!value) return "Tarix göstərilməyib";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return "Tarix göstərilməyib";

    return date.toLocaleString("az-AZ", {
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
    });
}

async function loadOrders() {
    try {
        const response = await fetch("/api/orders", {
            credentials:"same-origin"
        });

        const data = await response.json();

        if (response.status === 401) {
            ordersList.innerHTML =
                '<div class="empty">Sifarişlərinizi görmək üçün hesabınıza daxil olun.<br><br><a class="action primary" href="/login.html">Daxil ol</a></div>';
            return;
        }

        if (!response.ok || !data.success) {
            throw new Error(data.message || "Sifarişləri yükləmək mümkün olmadı.");
        }

        const orders = data.orders || [];

        if (!orders.length) {
            ordersList.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📦</div>
                    Hələ heç bir sifarişiniz yoxdur.
                    <div class="actions">
                        <a href="/#products" class="action primary">Məhsullara bax</a>
                    </div>
                </div>`;
            return;
        }

        ordersList.innerHTML = orders.map(order => {
            const status = getStatus(order.status);
            const items = order.items || [];

            const itemsHTML = items.length
                ? items.map(item => `
                    <div class="item">
                        <span>${escapeHTML(item.title || item.product_title || "Məhsul")} × ${escapeHTML(item.quantity || 1)}</span>
                        <strong>${(Number(item.price || 0) * Number(item.quantity || 1)).toFixed(2)} AZN</strong>
                    </div>
                `).join("")
                : '<div class="item"><span>Məhsul məlumatı mövcud deyil</span></div>';

            return `
                <article class="order">
                    <div class="order-top">
                        <div>
                            <div class="order-id">SİFARİŞ № #${escapeHTML(order.id)}</div>
                            <div class="order-date">${escapeHTML(formatDate(order.created_at || order.createdAt))}</div>
                        </div>
                        <span class="status ${status[1]}">${escapeHTML(status[0])}</span>
                    </div>

                    <div class="items">
                        ${itemsHTML}
                    </div>

                    <div class="total">
                        <span>Ümumi məbləğ</span>
                        <strong>${Number(order.total ?? order.total_amount ?? order.total_price ?? 0).toFixed(2)} AZN</strong>
                    </div>
                </article>
            `;
        }).join("");

    } catch (error) {
        ordersList.innerHTML =
            '<div class="error">' + escapeHTML(error.message) + '</div>';
    }
}

loadOrders();
</script>

</body>
</html>
