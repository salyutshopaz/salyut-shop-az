
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | SALYUT SHOP AZ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-container {
            width: 90%;
            max-width: 430px;
            margin: 65px auto;
            padding: 35px;
            border: 1px solid #eee;
            border-radius: 12px;
            box-shadow: 0 5px 25px #0000000d;
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .login-container label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .login-container input[type="email"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .remember {
            display: flex !important;
            align-items: center;
            gap: 9px;
            margin-top: 18px !important;
            font-size: 14px;
        }

        .login-container button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: #111;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .register-link a {
            color: #111;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #b00020;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">SALYUT <span>SHOP AZ</span></div>
    <a href="/" style="color:#111;text-decoration:none">Ana səhifə</a>
</header>

<main class="login-container">
    <h1>Hesabına daxil ol</h1>
    <p class="subtitle">Xoş gəlmisən!</p>

    <form id="loginForm">
        <label for="email">E-poçt</label>
        <input type="email" id="email" placeholder="example@gmail.com" required>

        <label for="password">Şifrə</label>
        <input type="password" id="password" placeholder="Şifrən" required>

        <label class="remember">
            <input type="checkbox" id="remember">
            Girişi yadda saxla
        </label>

        <button type="submit" id="loginButton">GİRİŞ ET</button>
        <p id="message"></p>
    </form>

    <p class="register-link">
        Hesabın yoxdur?
        <a href="/register.html">Qeydiyyatdan keç</a>
    </p>
</main>

<footer>© 2026 SALYUT SHOP AZ</footer>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const remember = document.getElementById("remember").checked;

    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    button.disabled = true;
    button.textContent = "GİRİŞ EDİLİR...";
    message.textContent = "";

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email,
                password,
                remember
            })
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.message || "E-poçt və ya şifrə yanlışdır.";
            return;
        }

        message.style.color = "green";
        message.textContent = "Giriş uğurludur!";

        window.location.href = "/";

    } catch (error) {
        message.textContent = "Serverlə əlaqə yaratmaq mümkün olmadı.";
    } finally {
        button.disabled = false;
        button.textContent = "GİRİŞ ET";
    }
});
</script>

</body>
</html>
