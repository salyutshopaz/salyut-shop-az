
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131b">
    <title>Səbətim | SALYUT SHOP AZ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #10131b;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px 6%;
            background: #171b25;
            border-bottom: 1px solid #292e3b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: #ff8a00;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 18px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 22px;
        }

        .panel {
            background: #191e29;
            border: 1px solid #303746;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .panel h2 {
            font-size: 19px;
            margin-bottom: 18px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #303746;
        }

        .cart-item img {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 9px;
            background: #252b38;
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-info h3 {
            font-size: 15px;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .price {
            color: #ff9900;
            font-weight: bold;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity button,
        .remove {
            background: #292f3c;
            color: white;
            border: 0;
            border-radius: 6px;
            padding: 7px 11px;
            cursor: pointer;
        }

        .remove {
            color: #ff6666;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 13px;
            background: #101520;
            border: 1px solid #343c4c;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 7px;
            color: #c5cad5;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 14px 0;
            color: #c5cad5;
        }

        .total {
            font-size: 22px;
            color: #ff9900;
            font-weight: bold;
        }

        .submit {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 9px;
            background: #ff8a00;
            color: #111;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
        }

        .submit:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            line-height: 1.5;
        }

        .empty {
            text-align: center;
            color: #aeb5c2;
            padding: 35px 10px;
        }

        .empty a {
            display: inline-block;
            margin-top: 15px;
            color: #ff9900;
        }

        @media(max-width: 750px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <strong>SALYUT SHOP <span style="color:#ff8a00">AZ</span></strong>
    <a href="/">← Mağazaya qayıt</a>
</header>

<main class="container">
    <h1>Səbətim</h1>

    <div id="message" class="message"></div>

    <div class="layout">
        <section class="panel">
            <h2>🛒 Səbətdəki məhsullar</h2>
            <div id="cartItems"></div>
        </section>

        <section>
            <div class="panel">
                <h2>📦 Çatdırılma məlumatları</h2>

                <form id="checkoutForm">
                    <label for="customerName">Ad və soyad</label>
                    <input id="customerName" maxlength="100" required>

                    <label for="phone">Telefon</label>
                    <input id="phone" type="tel" maxlength="30"
                           placeholder="+994..." required>

                    <label for="city">Şəhər / Rayon</label>
                    <input id="city" maxlength="100" required>

                    <label for="settlement">Yaşayış məntəqəsi</label>
                    <input id="settlement" maxlength="100" required>

                    <label for="postalCode">Poçt indeksi</label>
                    <input id="postalCode" maxlength="20">

                    <label for="address">Ətraflı ünvan</label>
                    <textarea id="address" maxlength="1000"
                              placeholder="Küçə, bina, mənzil..." required></textarea>

                    <button class="submit" id="orderButton" type="submit">
                        Sifarişi təsdiqlə
                    </button>
                </form>
            </div>

            <div class="panel">
                <h2>💳 Sifarişin yekunu</h2>

                <div class="summary-row">
                    <span>Məhsul sayı</span>
                    <strong id="itemCount">0</strong>
                </div>

                <div class="summary-row">
                    <span>Ümumi məbləğ</span>
                    <strong class="total" id="totalPrice">0.00 AZN</strong>
                </div>

                <p style="color:#aeb5c2;font-size:12px;margin-top:12px">
                    Ödəniş sifariş təsdiqlənərkən hesab balansınızdan çıxılacaq.
                </p>
            </div>
        </section>
    </div>
</main>

<script>
const CART_KEY = "salyut_cart";

function getCart() {
    try {
        const cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
        return Array.isArray(cart) ? cart : [];
    } catch {
        return [];
    }
}

function saveCart(cart) {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function showMessage(text, success = false) {
    const box = document.getElementById("message");
    box.textContent = text;
    box.style.display = "block";
    box.style.background = success ? "#173b2c" : "#482326";
    box.style.color = success ? "#8df0b4" : "#ffaaaa";
}

function renderCart() {
    const cart = getCart();
    const container = document.getElementById("cartItems");

    if (!cart.length) {
        container.innerHTML = `
            <div class="empty">
                Səbətiniz boşdur.
                <br>
                <a href="/">Məhsullara bax</a>
            </div>
        `;
    } else {
        container.innerHTML = cart.map((item, index) => {
            const title = String(item.title || "Məhsul");
            const price = Number(item.price);
            const quantity = Number(item.quantity);
            const image = typeof item.image === "string" &&
                item.image.startsWith("/uploads/products/")
                ? item.image : "";

            return `
                <div class="cart-item">
                    <img src="${escapeHtml(image)}" alt=""
                         onerror="this.style.display='none'">
                    <div class="item-info">
                        <h3>${escapeHtml(title)}</h3>
                        <div class="price">${Number.isFinite(price) ? price.toFixed(2) : "0.00"} AZN</div>
                        <div class="quantity">
                            <button type="button" onclick="changeQuantity(${index},-1)">−</button>
                            <strong>${Number.isInteger(quantity) ? quantity : 1}</strong>
                            <button type="button" onclick="changeQuantity(${index},1)">+</button>
                            <button type="button" class="remove"
                                onclick="removeItem(${index})">Sil</button>
                        </div>
                    </div>
                </div>
            `;
        }).join("");
    }

    const count = cart.reduce((sum, item) => {
        const quantity = Number(item.quantity);
        return sum + (Number.isInteger(quantity) && quantity > 0 ? quantity : 0);
    }, 0);

    const total = cart.reduce((sum, item) => {
        const price = Number(item.price);
        const quantity = Number(item.quantity);
        if (!Number.isFinite(price) || price < 0 ||
            !Number.isInteger(quantity) || quantity < 1) return sum;
        return sum + price * quantity;
    }, 0);

    document.getElementById("itemCount").textContent = count;
    document.getElementById("totalPrice").textContent =
        total.toFixed(2) + " AZN";

    document.getElementById("orderButton").disabled = !cart.length;
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}

function changeQuantity(index, amount) {
    const cart = getCart();
    if (!cart[index]) return;

    const quantity = Number(cart[index].quantity) + amount;

    if (quantity < 1) {
        cart.splice(index, 1);
    } else if (quantity <= 99) {
        cart[index].quantity = quantity;
    }

    saveCart(cart);
    renderCart();
}

function removeItem(index) {
    const cart = getCart();
    cart.splice(index, 1);
    saveCart(cart);
    renderCart();
}

async function loadProfile() {
    try {
        const response = await fetch("/api/profile");
        if (!response.ok) return;

        const data = await response.json();
        if (!data.user) return;

        document.getElementById("customerName").value = data.user.name || "";
        document.getElementById("phone").value = data.user.phone || "";
        document.getElementById("city").value = data.user.city || "";
        document.getElementById("settlement").value =
            data.user.settlement || "";
        document.getElementById("postalCode").value =
            data.user.postal_code || "";
        document.getElementById("address").value =
            data.user.address || "";
    } catch (error) {
        console.error(error);
    }
}

document.getElementById("checkoutForm").addEventListener("submit", async event => {
    event.preventDefault();

    const cart = getCart();

    if (!cart.length) {
        showMessage("Səbətiniz boşdur.");
        return;
    }

    const items = cart.map(item => ({
        id: Number(item.id),
        quantity: Number(item.quantity)
    }));

    if (items.some(item =>
        !Number.isInteger(item.id) || item.id < 1 ||
        !Number.isInteger(item.quantity) ||
        item.quantity < 1 || item.quantity > 99
    )) {
        showMessage("Səbətdəki məhsul məlumatları düzgün deyil.");
        return;
    }

    const button = document.getElementById("orderButton");
    button.disabled = true;
    button.textContent = "Sifariş göndərilir...";


const body = {
    name: document.getElementById("customerName").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    city: document.getElementById("city").value.trim(),
    settlement: document.getElementById("settlement").value.trim(),
    postal_code: document.getElementById("postalCode").value.trim(),
    address: document.getElementById("address").value.trim(),
    items
};


    try {
        const response = await fetch("/api/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            showMessage(data.message || "Sifariş yaratmaq mümkün olmadı.");
            return;
        }

        localStorage.removeItem(CART_KEY);

        showMessage(
            "Sifarişiniz uğurla yaradıldı! Sifariş №" +
            data.order.id + ". Balansınız: " +
            Number(data.balance).toFixed(2) + " AZN",
            true
        );

        renderCart();

    } catch (error) {
        console.error(error);
        showMessage("Serverə qoşulmaq mümkün olmadı.");
    } finally {
        button.disabled = getCart().length === 0;
        button.textContent = "Sifarişi təsdiqlə";
    }
});

renderCart();
loadProfile();
</script>

</body>
</html>
